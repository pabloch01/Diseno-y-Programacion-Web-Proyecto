<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planes PEI | CNEHK Gestión académica</title>
  <link rel="stylesheet" href="../css/planes_pei.css">
</head>
<body>

  <div class="contenedor-general-aplicacion">

    <!-- barra lateral de navegación -->
    <nav class="barra-lateral-navegacion" aria-label="Navegación principal">
      <div>
        <div class="encabezado-marca-sistema">
          <img class="icono-marca-sistema" src="../imgs/logo.jpeg" alt="Logo CNEHK Gestión académica">
          <div class="texto-marca-sistema">
            <p class="nombre-sistema">CNEHK</p>
            <p class="descripcion-sistema">Gestión académica</p>
          </div>
        </div>

        <div class="lista-modulos-navegacion">
          <p class="etiqueta-grupo-modulos">Módulos</p>
          <ul>
            <li>
              <a class="enlace-modulo-navegacion" href="dashboard_terapeuta.html">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
                <span class="texto-enlace-modulo">Dashboard</span>
              </a>
            </li>
            <li>
              <a class="enlace-modulo-navegacion" href="planes_pei.html" aria-current="page">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
                <span class="texto-enlace-modulo">Planes PEI</span>
              </a>
            </li>
            <li>
              <a class="enlace-modulo-navegacion" href="progreso.html">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15v2M12 11v6M16 7v10"/></svg>
                <span class="texto-enlace-modulo">Progreso</span>
              </a>
            </li>
          </ul>
        </div>
      </div>

      <div class="tarjeta-perfil-usuario-actual">
        <div class="avatar-iniciales-circular" aria-hidden="true">CR</div>
        <div class="grupo-nombre-y-rol-usuario texto-perfil-usuario">
          <p class="nombre-usuario-actual">Carmen Reyes</p>
          <p class="rol-usuario-actual">Terapeuta</p>
        </div>
      </div>
    </nav>

    <!-- columna principal -->
    <div class="columna-contenido-derecha">

      <header class="barra-superior-encabezado">
        <h1 class="titulo-seccion-etiqueta">Planes PEI</h1>
        <div class="tarjeta-perfil-usuario-barra-superior">
          <div class="avatar-iniciales-circular avatar-iniciales-pequeno" aria-hidden="true">CR</div>
          <p class="nombre-usuario-actual">Carmen Reyes</p>
        </div>
      </header>

      <main class="area-principal-planes-pei">

        <!-- encabezado de la sección -->
        <section class="fila-encabezado-planes-pei" aria-label="Resumen de planes PEI">
          <div>
            <h2>Planes educativos individualizados</h2>
            <p class="detalle-secundario-estadistica" id="estadistica-resumen-planes">5 activos · 8 total</p>
          </div>
          <button type="button" class="boton-nuevo-pei" id="boton-abrir-nuevo-pei">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Nuevo PEI
          </button>
        </section>

        <!-- Barra de búsqueda y filtros -->
        <section class="barra-busqueda-y-filtros" aria-label="Buscar y filtrar planes">
          <div class="campo-busqueda-estudiante-plan">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <label for="entrada-busqueda-estudiante-plan" class="etiqueta-oculta-accesible">Buscar estudiante o plan</label>
            <input type="search" id="entrada-busqueda-estudiante-plan" placeholder="Buscar estudiante o plan">
          </div>

          <div class="grupo-filtros-estado-pei" role="group" aria-label="Filtrar por estado del plan">
            <button type="button" class="boton-filtro-estado-pei filtro-seleccionado-activo" data-filtro="todos" aria-pressed="true">Todos</button>
            <button type="button" class="boton-filtro-estado-pei" data-filtro="activo" aria-pressed="false">Activos</button>
            <button type="button" class="boton-filtro-estado-pei" data-filtro="pausado" aria-pressed="false">Pausados</button>
            <button type="button" class="boton-filtro-estado-pei" data-filtro="completado" aria-pressed="false">Completados</button>
          </div>
        </section>

        <!-- Listado de planes PEI -->
        <section class="listado-planes-pei" id="contenedor-listado-planes" aria-label="Listado de planes educativos individualizados">
        </section>
      </main>

    </div>
  </div>

  <!-- Modal Crear / Editar PEI -->
  <div class="overlay-modal-pei" id="modal-pei" hidden>
    <div class="caja-modal-pei" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-pei">
      <div class="encabezado-modal-pei">
        <h2 class="titulo-modal-pei" id="titulo-modal-pei">Nuevo PEI</h2>
        <button type="button" class="boton-cerrar-modal-pei" id="boton-cerrar-modal-pei" aria-label="Cerrar">&times;</button>
      </div>

      <form id="formulario-pei" class="formulario-pei" novalidate>
        <div class="grupo-campo-formulario">
          <label for="input-nombre-estudiante">Nombre del estudiante</label>
          <input type="text" id="input-nombre-estudiante" placeholder="Ej. Sebastián Morales">
          <span class="mensaje-error-campo" data-error-de="nombreEstudiante"></span>
        </div>

        <div class="grupo-campo-formulario">
          <label for="input-titulo-plan">Título del plan</label>
          <input type="text" id="input-titulo-plan" placeholder="Ej. Cocina adaptada">
          <span class="mensaje-error-campo" data-error-de="tituloPlan"></span>
        </div>

        <div class="fila-doble-campo">
          <div class="grupo-campo-formulario">
            <label for="select-categoria-pei">Categoría</label>
            <select id="select-categoria-pei">
              <option value="">Selecciona una opción</option>
              <option value="Habilidades para la vida">Habilidades para la vida</option>
              <option value="Autonomía personal">Autonomía personal</option>
              <option value="Comunicación">Comunicación</option>
              <option value="Académico">Académico</option>
            </select>
            <span class="mensaje-error-campo" data-error-de="categoria"></span>
          </div>

          <div class="grupo-campo-formulario">
            <label for="select-estado-pei">Estado</label>
            <select id="select-estado-pei">
              <option value="">Selecciona una opción</option>
              <option value="activo">Activo</option>
              <option value="pausado">Pausado</option>
              <option value="completado">Completado</option>
            </select>
            <span class="mensaje-error-campo" data-error-de="estado"></span>
          </div>
        </div>

        <div class="fila-doble-campo">
          <div class="grupo-campo-formulario">
            <label for="input-fecha-inicio">Fecha de inicio</label>
            <input type="date" id="input-fecha-inicio">
            <span class="mensaje-error-campo" data-error-de="fechaInicio"></span>
          </div>
          <div class="grupo-campo-formulario">
            <label for="input-fecha-revision">Fecha de revisión</label>
            <input type="date" id="input-fecha-revision">
            <span class="mensaje-error-campo" data-error-de="fechaRevision"></span>
          </div>
        </div>

        <div class="fila-doble-campo">
          <div class="grupo-campo-formulario">
            <label for="input-objetivos-totales">Total de objetivos</label>
            <input type="number" id="input-objetivos-totales" min="1" max="20">
            <span class="mensaje-error-campo" data-error-de="objetivosTotales"></span>
          </div>
          <div class="grupo-campo-formulario">
            <label for="input-objetivos-completados">Objetivos completados</label>
            <input type="number" id="input-objetivos-completados" min="0">
            <span class="mensaje-error-campo" data-error-de="objetivosCompletados"></span>
          </div>
        </div>

        <div class="grupo-campo-formulario">
          <label for="input-descripcion-pei">Descripción</label>
          <textarea id="input-descripcion-pei" rows="3" placeholder="Describe brevemente el plan..."></textarea>
          <span class="mensaje-error-campo" data-error-de="descripcion"></span>
        </div>

        <div class="pie-formulario-pei">
          <button type="button" class="boton-secundario-formulario" id="boton-cancelar-formulario-pei">Cancelar</button>
          <button type="submit" class="boton-primario-formulario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de confirmación para eliminar -->
  <div class="overlay-modal-pei" id="modal-confirmacion-eliminar" hidden>
    <div class="caja-modal-pei caja-modal-confirmacion" role="dialog" aria-modal="true">
      <div class="encabezado-modal-pei">
        <h2 class="titulo-modal-pei">Eliminar plan PEI</h2>
      </div>
      <p id="texto-confirmacion-eliminar"></p>
      <div class="pie-formulario-pei">
        <button type="button" class="boton-secundario-formulario" id="boton-cancelar-eliminar">Cancelar</button>
        <button type="button" class="boton-eliminar-plan-pei" id="boton-confirmar-eliminar">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Notificaciones -->
  <div class="contenedor-notificaciones" id="contenedor-notificaciones" aria-live="polite"></div>

  <script src="../js/planes_pei.js"></script>
</body>
</html>
